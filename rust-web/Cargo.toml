[package]
name = "cannon-hill-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cannon-hill-lan"
path = "src/lan.rs"
required-features = ["lan"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"], optional = true }

[features]
lan = ["dep:axum", "dep:serde", "dep:serde_json", "dep:tokio"]
bench = []
bench-large = ["bench"]
bench-full-scan = ["bench"]

[profile.release]
opt-level = "s"
lto = true
strip = true
